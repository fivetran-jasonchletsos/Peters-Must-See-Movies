version: 2

sources:
    - name: raw_spotify
      description: Raw Spotify data landed by Fivetran into Snowflake (LINER_NOTES database, raw_spotify schema).
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'LINER_NOTES') }}"
      schema: raw_spotify
      tables:
          - name: recently_played
            description: Tracks played in the last 50 events (Spotify API limit). Refreshed on cadence.
          - name: top_tracks_short_term
            description: Top tracks over the last 4 weeks.
          - name: top_tracks_medium_term
            description: Top tracks over the last 6 months.
          - name: top_tracks_long_term
            description: Top tracks over all time (Spotify definition).
          - name: top_artists_short_term
            description: Top artists over the last 4 weeks.
          - name: top_artists_medium_term
            description: Top artists over the last 6 months.
          - name: top_artists_long_term
            description: Top artists over all time.
          - name: saved_albums
            description: Albums saved to the user's library.

    - name: raw_mb
      description: MusicBrainz data landed by Fivetran into Snowflake (LINER_NOTES database, raw_mb schema).
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'LINER_NOTES') }}"
      schema: raw_mb
      tables:
          - name: artists
            description: MusicBrainz artist entities.
          - name: releases
            description: MusicBrainz release (album) entities.
          - name: recordings
            description: MusicBrainz recording (track) entities.
