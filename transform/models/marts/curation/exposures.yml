version: 2

exposures:
    - name: liner_notes_site
      type: application
      maturity: medium
      description: |
          The Liner Notes single-page application — a static Next.js site that
          visualises Jason's Spotify listening data against his curated album canon.
          The SPA reads pre-built JSON files from the /public directory (generated
          by the export_lineage.py script) and renders five main views:

            - Overview: play counts, canon coverage, decade bias chart
            - Canon vs Listening: per-album play stats from canon_vs_listening
            - Discoveries: non-canon artists from the discoveries model
            - Top Tracks / Artists: ranked windows from agg_top_tracks_by_window
              and agg_top_artists_by_window
            - Architecture: lineage graph generated from lineage.json

          Because the site is fully static, it does not query Snowflake at runtime.
          Data freshness is determined by when the dbt pipeline last ran and the
          JSON exports were regenerated.
      url: https://github.com/fivetran-jasonchletsos/LinerNotes-ODI-Demo
      owner:
          name: Jason Chletsos
          email: jason.chletsos@fivetran.com

      depends_on:
          - ref('dim_albums')
          - ref('dim_artists')
          - ref('fct_plays')
          - ref('canon_vs_listening')
          - ref('decade_distribution')
          - ref('discoveries')
          - ref('agg_top_artists_by_window')
          - ref('agg_top_tracks_by_window')
