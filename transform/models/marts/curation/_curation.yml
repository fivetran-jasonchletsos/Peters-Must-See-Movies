version: 2

# Curation-layer models live in the `curation` sub-schema.
# This file provides additional column-level tests and descriptions specifically
# for the curation layer. The top-level model descriptions live in _marts.yml;
# this file adds cross-model relationship tests that are easier to reason about
# in the context of the curation layer.

models:
    - name: canon_vs_listening
      description: |
          One row per canon album seed entry. Shows whether each curated album has
          been listened to recently, derived by joining canon_albums -> dim_albums
          -> fct_plays. Grain: canon title + artist (the canon seed primary key).
      columns:
          - name: canon_artist
            description: Artist name verbatim from canon_albums.csv.
            data_tests:
                - not_null
          - name: canon_title
            description: Album title verbatim from canon_albums.csv.
            data_tests:
                - not_null
          - name: canon_year
            description: Release year from canon_albums.csv. Must be a plausible 4-digit year.
            data_tests:
                - not_null
          - name: canon_note
            description: Jason's curatorial annotation from canon_albums.csv.
          - name: spotify_album_id
            description: Spotify album ID found via dim_albums title+artist fuzzy join. Null when no match.
          - name: mb_release_id
            description: MusicBrainz release MBID found via dim_albums. Null when no match.
          - name: last_played_at
            description: Timestamp of the most recent play event for this album. Null if never played.
          - name: play_count_30d
            description: Track-play count in the 30 days prior to the latest play in the dataset.
            data_tests:
                - not_null
          - name: total_play_minutes
            description: All-time cumulative listening minutes for this album from fct_plays.
          - name: in_top_50_long_term
            description: True if any track from this album appears in the long-term Spotify top-50.
            data_tests:
                - not_null
                - accepted_values:
                      values:
                          - true
                          - false

    - name: discoveries
      description: |
          Top Spotify artists with no matching entry in canon_albums.csv. These
          are artists the user listens to but has not yet curated. Excludes
          "Various Artists", "Soundtrack", and "Anonymous". Grain: spotify_artist_id.
      columns:
          - name: spotify_artist_id
            description: Spotify artist ID (primary key for this model).
            data_tests:
                - not_null
                - unique
          - name: artist_name
            description: Artist name from Spotify.
            data_tests:
                - not_null
          - name: genres_raw
            description: Comma-separated genre string from the Spotify top-artists feed.
          - name: max_popularity
            description: Maximum Spotify popularity score across all time windows (0–100).
          - name: best_rank_any_window
            description: Minimum (best) rank position across all time windows.
          - name: long_term_rank
            description: Rank in the long-term top-artists list. Null if not present.
          - name: medium_term_rank
            description: Rank in the medium-term top-artists list. Null if not present.
          - name: short_term_rank
            description: Rank in the short-term top-artists list. Null if not present.

    - name: decade_distribution
      description: |
          Play minutes and canon album counts rolled up by decade. play_pct and
          canon_pct allow comparison of listening distribution versus curation
          distribution by decade. Grain: decade bucket (one row per decade).
      columns:
          - name: decade
            description: Decade bucket as integer (e.g., 1970, 1980, 1990). Primary key.
            data_tests:
                - not_null
                - unique
          - name: total_play_minutes
            description: Sum of fct_plays.duration_minutes for albums released in this decade.
          - name: canon_album_count
            description: Count of canon_albums.csv entries with a release year in this decade.
          - name: play_pct
            description: Percentage share of total play minutes for this decade (0–100).
          - name: canon_pct
            description: Percentage share of total canon albums for this decade (0–100).
          - name: grand_total_play_minutes
            description: Denominator for play_pct — total play minutes across all decades.
          - name: grand_total_canon_albums
            description: Denominator for canon_pct — total canon album count across all decades.
